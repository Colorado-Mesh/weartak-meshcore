[versions]
# Keep agp and kotlin the same as WearMesh and meshcore-kotlin, which this build includes. The WearTAK plugin SDK itself is built with AGP 8.7.2 and Kotlin 2.0.21.
agp = "8.7.3"
kotlin = "2.0.21"
coreKtx = "1.15.0"
# The radio screen, with the same Compose for Wear OS versions as WearMesh.
activityCompose = "1.9.3"
wearCompose = "1.4.0"
junit = "4.13.2"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
wear-compose-material = { module = "androidx.wear.compose:compose-material", version.ref = "wearCompose" }
wear-compose-foundation = { module = "androidx.wear.compose:compose-foundation", version.ref = "wearCompose" }
junit = { module = "junit:junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-parcelize = { id = "org.jetbrains.kotlin.plugin.parcelize", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
